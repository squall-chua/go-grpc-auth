syntax = "proto3";

package auth.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "api/proto/options/v1/auth_rule.proto";

option go_package = "github.com/squall-chua/go-grpc-auth/api/v1/auth;auth";

service OIDCService {
  // UserInfo endpoint
  rpc GetUserInfo(GetUserInfoRequest) returns (UserInfo) {
    option (google.api.http) = {
      get: "/oauth2/userinfo"
    };
  }

  // Discovery
  rpc GetDiscovery(google.protobuf.Empty) returns (google.protobuf.Struct) {
    option (google.api.http) = {
      get: "/.well-known/openid-configuration"
    };
    option (options.v1.rule) = {
      public: true
    };
  }

  rpc GetJWKS(google.protobuf.Empty) returns (google.protobuf.Struct) {
    option (google.api.http) = {
      get: "/.well-known/jwks.json"
    };
    option (options.v1.rule) = {
      public: true
    };
  }

  // Consent management
  rpc GetConsentRequest(GetConsentRequestRequest) returns (ConsentDetails) {
    option (google.api.http) = {
      get: "/v1/oidc/consent"
    };
  }

  rpc AcceptConsent(AcceptConsentRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/oidc/consent/accept"
      body: "*"
    };
  }

  rpc RejectConsent(RejectConsentRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/oidc/consent/reject"
      body: "*"
    };
  }

  // Authorization
  rpc Authorize(AuthorizeRequest) returns (AuthorizeResponse) {
    option (google.api.http) = {
      get: "/oauth2/authorize"
    };
    option (options.v1.rule) = {
      public: true
    };
  }

  // Token exchange
  rpc Token(TokenRequest) returns (TokenResponse) {
    option (google.api.http) = {
      post: "/oauth2/token"
      body: "*"
    };
    option (options.v1.rule) = {
      public: true
    };
  }

  // Logout
  rpc Logout(OIDCLogoutRequest) returns (LogoutResponse) {
    option (google.api.http) = {
      get: "/oauth2/logout"
    };
  }
}

message AuthorizeRequest {
  string response_type = 1;
  string client_id = 2;
  string redirect_uri = 3;
  string scope = 4;
  string state = 5;
  string nonce = 6;
  string code_challenge = 7;
  string code_challenge_method = 8;
  string prompt = 9;
  string namespace = 10;
}

message AuthorizeResponse {
  string redirect_uri = 1;
}

message TokenRequest {
  string grant_type = 1;
  string code = 2;
  string redirect_uri = 3;
  string client_id = 4;
  string client_secret = 5;
  string refresh_token = 6;
  string code_verifier = 7;
  string namespace = 8;
}

message TokenResponse {
  string access_token = 1;
  string token_type = 2;
  int32 expires_in = 3;
  string refresh_token = 4;
  string id_token = 5;
}

message GetUserInfoRequest {}

message UserInfo {
  string sub = 1;
  string name = 2;
  string email = 3;
  string picture = 4;
  string namespace = 5;
  repeated string roles = 6;
}

message GetConsentRequestRequest {
  string client_id = 1;
  repeated string scopes = 2;
}

message ConsentDetails {
  string client_name = 1;
  repeated string scopes = 2;
}

message AcceptConsentRequest {
  string client_id = 1;
  repeated string scopes = 2;
}

message RejectConsentRequest {
  string client_id = 1;
}

message OIDCLogoutRequest {
  string id_token_hint = 1;
  string post_logout_redirect_uri = 2;
}

message LogoutResponse {
  string redirect_uri = 1;
}
