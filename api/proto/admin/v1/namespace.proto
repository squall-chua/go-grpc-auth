syntax = "proto3";

package admin.v1;

import "api/proto/options/v1/auth_rule.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

option go_package = "github.com/squall-chua/go-grpc-auth/api/v1/admin;admin";

service NamespaceService {
  rpc CreateNamespace(CreateNamespaceRequest) returns (Namespace) {
    option (google.api.http) = {
      post: "/v1/admin/namespaces"
      body: "*"
    };
    option (options.v1.rule) = {
      roles: ["superadmin"]
    };
  }

  rpc GetNamespace(GetNamespaceRequest) returns (Namespace) {
    option (google.api.http) = {get: "/v1/admin/namespaces/{id}"};
    option (options.v1.rule) = {
      roles: ["superadmin"]
    };
  }

  rpc UpdateNamespaceConfig(UpdateNamespaceConfigRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      patch: "/v1/admin/namespaces/{id}/config"
      body: "*"
    };
    option (options.v1.rule) = {
      roles: ["superadmin"]
    };
  }

  rpc ListNamespaces(ListNamespacesRequest) returns (ListNamespacesResponse) {
    option (google.api.http) = {get: "/v1/admin/namespaces"};
    option (options.v1.rule) = {
      roles: ["superadmin"]
    };
  }

  rpc DeleteNamespace(DeleteNamespaceRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/admin/namespaces/{id}"};
    option (options.v1.rule) = {
      roles: ["superadmin"]
    };
  }
}

message Namespace {
  string id = 1;
  string name = 2;
  NamespaceConfig config = 3;
}

enum MFAPolicy {
  MFA_POLICY_DISABLED = 0;
  MFA_POLICY_OPTIONAL = 1;
  MFA_POLICY_REQUIRED = 2;
}

message NamespaceConfig {
  MFAPolicy mfa_policy = 1;
  repeated string allowed_social_providers = 2;
  PasswordPolicy password_policy = 3;
  repeated string ip_allowlist = 4;
  repeated string ip_denylist = 5;
  string webhook_url = 6;
  string webhook_secret = 7;
  NotificationConfig notification = 8;
}

message NotificationConfig {
  string email_provider = 1;
  string sms_provider = 2;
  map<string, EmailTemplateOverride> email_templates = 3;
  map<string, SMSTemplateOverride> sms_templates = 4;
}

message EmailTemplateOverride {
  string subject = 1;
  string html_body = 2;
  string text_body = 3;
}

message SMSTemplateOverride {
  string body = 1;
}

message PasswordPolicy {
  int32 min_length = 1;
  bool require_uppercase = 2;
  bool require_lowercase = 3;
  bool require_number = 4;
  bool require_special = 5;
  int32 password_history = 6;
}

message CreateNamespaceRequest {
  string name = 1;
  NamespaceConfig config = 2;
}

message GetNamespaceRequest {
  string id = 1;
}

message UpdateNamespaceConfigRequest {
  string id = 1;
  NamespaceConfig config = 2;
}

message ListNamespacesRequest {
  int32 page_size = 1;
  int32 page = 2;
  string query = 3; // partial match on namespace name
}

message ListNamespacesResponse {
  repeated Namespace namespaces = 1;
  int32 total_pages = 2;
  int32 total_count = 3;
}

message DeleteNamespaceRequest {
  string id = 1;
}
