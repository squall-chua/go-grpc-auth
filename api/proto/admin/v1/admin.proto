syntax = "proto3";

package admin.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "api/proto/options/v1/auth_rule.proto";

option go_package = "github.com/squall-chua/go-grpc-auth/api/v1/admin;admin";

service AdminService {
  // User Management
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (google.api.http) = {
      get: "/v1/admin/users"
    };
    option (options.v1.rule) = {
      roles: ["admin", "superadmin"]
      permissions: ["users:read"]
    };
  }

  rpc GetUser(GetUserRequest) returns (User) {
    option (google.api.http) = {
      get: "/v1/admin/users/{id}"
    };
    option (options.v1.rule) = {
      roles: ["admin", "superadmin"]
      permissions: ["users:read"]
    };
  }

  rpc UpdateUserStatus(UpdateUserStatusRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      patch: "/v1/admin/users/{id}/status"
      body: "*"
    };
    option (options.v1.rule) = {
      roles: ["admin", "superadmin"]
      permissions: ["users:write"]
    };
  }

  rpc ResetUserPassword(ResetUserPasswordRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/admin/users/{id}/password/reset"
      body: "*"
    };
    option (options.v1.rule) = {
      roles: ["admin", "superadmin"]
      permissions: ["users:write"]
    };
  }

  // RBAC
  rpc GrantRoles(GrantRolesRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/admin/users/{id}/roles"
      body: "*"
    };
    option (options.v1.rule) = {
      roles: ["superadmin"]
      permissions: ["roles:write"]
    };
  }

  rpc RevokeRoles(RevokeRolesRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/admin/users/{id}/roles"
    };
    option (options.v1.rule) = {
      roles: ["superadmin"]
      permissions: ["roles:write"]
    };
  }

  // Permissions management
  rpc GrantPermissions(GrantPermissionsRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/admin/users/{id}/permissions"
      body: "*"
    };
    option (options.v1.rule) = {
      roles: ["superadmin"]
      permissions: ["permissions:write"]
    };
  }

  rpc RevokePermissions(RevokePermissionsRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/admin/users/{id}/permissions"
    };
    option (options.v1.rule) = {
      roles: ["superadmin"]
      permissions: ["permissions:write"]
    };
  }

  // Role Management
  rpc CreateRole(CreateRoleRequest) returns (Role) {
    option (google.api.http) = {
      post: "/v1/admin/roles"
      body: "*"
    };
    option (options.v1.rule) = {
      roles: ["superadmin"]
      permissions: ["roles:write"]
    };
  }

  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse) {
    option (google.api.http) = {
      get: "/v1/admin/roles"
    };
    option (options.v1.rule) = {
      roles: ["admin", "superadmin"]
      permissions: ["roles:read"]
    };
  }

  rpc DeleteRole(DeleteRoleRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/admin/roles/{id}"
    };
    option (options.v1.rule) = {
      roles: ["superadmin"]
      permissions: ["roles:write"]
    };
  }

  // Permission Management
  rpc CreatePermission(CreatePermissionRequest) returns (Permission) {
    option (google.api.http) = {
      post: "/v1/admin/permissions"
      body: "*"
    };
    option (options.v1.rule) = {
      roles: ["superadmin"]
      permissions: ["permissions:write"]
    };
  }

  rpc ListPermissions(ListPermissionsRequest) returns (ListPermissionsResponse) {
    option (google.api.http) = {
      get: "/v1/admin/permissions"
    };
    option (options.v1.rule) = {
      roles: ["admin", "superadmin"]
      permissions: ["permissions:read"]
    };
  }

  rpc DeletePermission(DeletePermissionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/admin/permissions/{id}"
    };
    option (options.v1.rule) = {
      roles: ["superadmin"]
      permissions: ["permissions:write"]
    };
  }


  // Audit Logs
  rpc ListAuditLogs(ListAuditLogsRequest) returns (ListAuditLogsResponse) {
    option (google.api.http) = {
      get: "/v1/admin/audit"
    };
    option (options.v1.rule) = {
      roles: ["admin", "superadmin"]
      permissions: ["audit:read"]
    };
  }
}

enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  USER_STATUS_ACTIVE = 1;
  USER_STATUS_INACTIVE = 2;
  USER_STATUS_BANNED = 3;
}

message User {
  string id = 1;
  string email = 2;
  string username = 3;
  UserStatus status = 4;
  repeated string roles = 5;
  repeated string permissions = 6;
  string namespace = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message ListUsersRequest {
  int32 page_size = 1;
  int32 page = 2;
  string namespace = 3;
  string query = 4; // partial match on username or email
  string status = 5; // filter by user status (e.g. "active", "suspended")
}

message ListUsersResponse {
  repeated User users = 1;
  int32 total_pages = 2;
  int32 total_count = 3;
}

message GetUserRequest {
  string id = 1;
}

message UpdateUserStatusRequest {
  string id = 1;
  UserStatus status = 2;
}

message ResetUserPasswordRequest {
  string id = 1;
  string new_password = 2;
}

message GrantRolesRequest {
  string id = 1;
  repeated string roles = 2;
}

message RevokeRolesRequest {
  string id = 1;
  repeated string roles = 2;
}

message GrantPermissionsRequest {
  string id = 1;
  repeated string permissions = 2;
}

message RevokePermissionsRequest {
  string id = 1;
  repeated string permissions = 2;
}

message Role {
  string id = 1;
  string name = 2;
  string namespace = 3;
  repeated string permissions = 4;
}

message CreateRoleRequest {
  string name = 1;
  string namespace = 2;
  repeated string permissions = 3;
}

message ListRolesRequest {
  string namespace = 1;
  int32 page_size = 2;
  int32 page = 3;
}

message ListRolesResponse {
  repeated Role roles = 1;
  int32 total_pages = 2;
  int32 total_count = 3;
}

message DeleteRoleRequest {
  string id = 1;
}

message ListAuditLogsRequest {
  string namespace = 1;
  int32 page_size = 2;
  int32 page = 3;
  string event = 4; // filter by event type
  string user_id = 5; // filter by user ID
  google.protobuf.Timestamp from = 6; // start of time range
  google.protobuf.Timestamp to = 7; // end of time range
}

message ListAuditLogsResponse {
  repeated AuditLog logs = 1;
  int32 total_pages = 2;
  int32 total_count = 3;
}

message AuditLog {
  string id = 1;
  string event = 2;
  string user_id = 3;
  string namespace = 4;
  string ip = 5;
  string user_agent = 6;
  string metadata_json = 7;
  google.protobuf.Timestamp timestamp = 8;
}

message Permission {
  string id = 1;
  string name = 2;
  string namespace = 3;
  string description = 4;
}

message CreatePermissionRequest {
  string name = 1;
  string namespace = 2;
  string description = 3;
}

message ListPermissionsRequest {
  string namespace = 1;
  int32 page_size = 2;
  int32 page = 3;
}

message ListPermissionsResponse {
  repeated Permission permissions = 1;
  int32 total_pages = 2;
  int32 total_count = 3;
}

message DeletePermissionRequest {
  string id = 1;
}

