syntax = "proto3";

package admin.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "api/proto/options/v1/auth_rule.proto";

option go_package = "github.com/squall-chua/go-grpc-auth/api/v1/admin;admin";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Admin Service API";
    version: "1.0";
    description: "API for managing users and roles with gRPC and REST gateway.";
  };
  security_definitions: {
    security: {
      key: "Bearer";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "JWT Authorization header using the Bearer scheme. Example: \"Bearer {token}\"";
      }
    }
  };
  security: {
    security_requirement: {
      key: "Bearer";
    }
  };
};

service AdminService {
  // User Management
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (google.api.http) = {
      get: "/v1/admin/users"
    };
    option (options.v1.rule) = {
      roles: ["admin", "superadmin"]
      permissions: ["users:read"]
    };
  }

  rpc GetUser(GetUserRequest) returns (User) {
    option (google.api.http) = {
      get: "/v1/admin/users/{id}"
    };
    option (options.v1.rule) = {
      roles: ["admin", "superadmin"]
      permissions: ["users:read"]
    };
  }

  rpc UpdateUserStatus(UpdateUserStatusRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      patch: "/v1/admin/users/{id}/status"
      body: "*"
    };
    option (options.v1.rule) = {
      roles: ["admin", "superadmin"]
      permissions: ["users:write"]
    };
  }

  rpc ResetUserPassword(ResetUserPasswordRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/admin/users/{id}/password/reset"
      body: "*"
    };
    option (options.v1.rule) = {
      roles: ["admin", "superadmin"]
      permissions: ["users:write"]
    };
  }

  // RBAC
  rpc GrantRoles(GrantRolesRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/admin/users/{id}/roles"
      body: "*"
    };
    option (options.v1.rule) = {
      roles: ["superadmin"]
      permissions: ["roles:write"]
    };
  }

  rpc RevokeRoles(RevokeRolesRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/admin/users/{id}/roles"
    };
    option (options.v1.rule) = {
      roles: ["superadmin"]
      permissions: ["roles:write"]
    };
  }

  // Permissions management
  rpc GrantPermissions(GrantPermissionsRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/admin/users/{id}/permissions"
      body: "*"
    };
    option (options.v1.rule) = {
      roles: ["superadmin"]
      permissions: ["permissions:write"]
    };
  }

  rpc RevokePermissions(RevokePermissionsRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/admin/users/{id}/permissions"
    };
    option (options.v1.rule) = {
      roles: ["superadmin"]
      permissions: ["permissions:write"]
    };
  }

  // Role Management
  rpc CreateRole(CreateRoleRequest) returns (Role) {
    option (google.api.http) = {
      post: "/v1/admin/roles"
      body: "*"
    };
    option (options.v1.rule) = {
      roles: ["superadmin"]
      permissions: ["roles:write"]
    };
  }

  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse) {
    option (google.api.http) = {
      get: "/v1/admin/roles"
    };
    option (options.v1.rule) = {
      roles: ["admin", "superadmin"]
      permissions: ["roles:read"]
    };
  }

  rpc DeleteRole(DeleteRoleRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/admin/roles/{id}"
    };
    option (options.v1.rule) = {
      roles: ["superadmin"]
      permissions: ["roles:write"]
    };
  }

  // Service Accounts
  rpc ListServiceAccounts(ListServiceAccountsRequest) returns (ListServiceAccountsResponse) {
    option (google.api.http) = {
      get: "/v1/admin/service-accounts"
    };
    option (options.v1.rule) = {
      roles: ["admin", "superadmin"]
      permissions: ["service_accounts:read"]
    };
  }

  rpc CreateServiceAccount(CreateServiceAccountRequest) returns (ServiceAccount) {
    option (google.api.http) = {
      post: "/v1/admin/service-accounts"
      body: "*"
    };
    option (options.v1.rule) = {
      roles: ["admin", "superadmin"]
      permissions: ["service_accounts:write"]
    };
  }

  // Audit Logs
  rpc ListAuditLogs(ListAuditLogsRequest) returns (ListAuditLogsResponse) {
    option (google.api.http) = {
      get: "/v1/admin/audit"
    };
    option (options.v1.rule) = {
      roles: ["admin", "superadmin"]
      permissions: ["audit:read"]
    };
  }
}

message User {
  string id = 1;
  string email = 2;
  string username = 3;
  string status = 4; // active, inactive, banned
  repeated string roles = 5;
  repeated string permissions = 6;
  string namespace = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message ListUsersRequest {
  int32 page_size = 1;
  string page_token = 2;
  string namespace = 3;
  string query = 4;
}

message ListUsersResponse {
  repeated User users = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message GetUserRequest {
  string id = 1;
}

message UpdateUserStatusRequest {
  string id = 1;
  string status = 2;
}

message ResetUserPasswordRequest {
  string id = 1;
  string new_password = 2;
}

message GrantRolesRequest {
  string id = 1;
  repeated string roles = 2;
}

message RevokeRolesRequest {
  string id = 1;
  repeated string roles = 2;
}

message GrantPermissionsRequest {
  string id = 1;
  repeated string permissions = 2;
}

message RevokePermissionsRequest {
  string id = 1;
  repeated string permissions = 2;
}

message Role {
  string id = 1;
  string name = 2;
  string namespace = 3;
  repeated string permissions = 4;
}

message CreateRoleRequest {
  string name = 1;
  string namespace = 2;
  repeated string permissions = 3;
}

message ListRolesRequest {
  string namespace = 1;
}

message ListRolesResponse {
  repeated Role roles = 1;
}

message DeleteRoleRequest {
  string id = 1;
}

message ServiceAccount {
  string client_id = 1;
  string client_secret = 2;
  string name = 3;
  string namespace = 4;
  repeated string scopes = 5;
}

message ListServiceAccountsRequest {
  string namespace = 1;
}

message ListServiceAccountsResponse {
  repeated ServiceAccount service_accounts = 1;
}

message CreateServiceAccountRequest {
  string name = 1;
  string namespace = 2;
  repeated string scopes = 3;
}
message ListAuditLogsRequest {
  string namespace = 1;
  int32 page_size = 2;
  int32 page_token = 3;
}

message ListAuditLogsResponse {
  repeated AuditLog logs = 1;
  int32 next_page_token = 2;
  int64 total_count = 3;
}

message AuditLog {
  string id = 1;
  string event = 2;
  string user_id = 3;
  string namespace = 4;
  string ip = 5;
  string user_agent = 6;
  string metadata_json = 7;
  google.protobuf.Timestamp timestamp = 8;
}
